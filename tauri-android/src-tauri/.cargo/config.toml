# Android 15+ devices can run with 16 KB memory pages, and Play requires
# 64-bit native libraries to be 16 KB aligned. NDK r27 still links at 4 KB by
# default, so ask the linker for 16 KB LOAD segment alignment.
[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.x86_64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]
