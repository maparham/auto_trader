<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pinned Line Drift</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
  /* Layout: one reading column; the timeframe switch doubles as the result readout, chart below, arithmetic last. */
  :root {
    --bg: #f5f7fa;
    --surface: #ffffff;
    --fg: #17202b;
    --muted: #5d6b7c;
    --rule: #d9e0e8;
    --band: #ebeff4;
    --drawn: #1f6fd6;
    --pinned: #c2570c;
    --timed: #7e3fe0;
    --up: #1d9a6c;
    --down: #d2434f;
    --font-display: "Space Grotesk", "Inter", system-ui, sans-serif;
    --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10151c; --surface: #171e27; --fg: #e4eaf1; --muted: #93a1b2; --rule: #2a3441;
      --band: #1c2530; --drawn: #5aa2ff; --pinned: #f0934a; --timed: #b794ff; --up: #3cc08d; --down: #ee6672;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #10151c; --surface: #171e27; --fg: #e4eaf1; --muted: #93a1b2; --rule: #2a3441;
    --band: #1c2530; --drawn: #5aa2ff; --pinned: #f0934a; --timed: #b794ff; --up: #3cc08d; --down: #ee6672;
    color-scheme: dark;
  }
  body {
    background: var(--bg); color: var(--fg);
    font-family: var(--font-body); font-size: 15px; line-height: 1.55;
    padding-block: 28px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  main { max-width: 940px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
  h1 { font-family: var(--font-display); font-size: 28px; font-weight: 600; line-height: 1.15; margin: 0; text-wrap: balance; }
  h2 { font-family: var(--font-display); font-size: 18px; font-weight: 600; margin: 0; }
  p { margin: 0; max-width: 68ch; }
  .lede { color: var(--muted); }
  .num { font-variant-numeric: tabular-nums; }

  .controls { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; }
  .tfs { display: flex; flex-wrap: wrap; gap: 8px; }
  .tf {
    font: inherit; color: var(--fg); background: var(--surface);
    border: 1px solid var(--rule); border-radius: 6px; padding: 8px 14px;
    display: flex; flex-direction: column; align-items: flex-start; gap: 2px; cursor: pointer; min-width: 112px;
  }
  .tf:hover { border-color: var(--muted); }
  .tf:focus-visible, input:focus-visible { outline: 2px solid var(--drawn); outline-offset: 2px; }
  .tf[aria-pressed="true"] { border-color: var(--drawn); box-shadow: inset 0 0 0 1px var(--drawn); }
  .tf .lab { font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
  .tf .val { font-family: var(--font-display); font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .tf .timed { color: var(--timed); }
  .tf .off { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .check { display: flex; gap: 8px; align-items: center; color: var(--muted); }

  .chartbox { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; overflow-x: auto; }
  svg { display: block; width: 100%; min-width: 620px; height: auto; }
  svg text { font-family: var(--font-body); font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 20px; font-size: 13px; color: var(--muted); }
  .legend span::before { content: ""; display: inline-block; width: 18px; margin-inline-end: 6px; vertical-align: middle; border-top: 2px solid var(--drawn); }
  .legend .p::before { border-top: 2px dashed var(--pinned); }
  .legend .t::before { border-top: 2px dotted var(--timed); }

  ol { margin: 0; padding-inline-start: 22px; display: flex; flex-direction: column; gap: 8px; max-width: 70ch; }
  .tablewrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; min-width: 780px; font-variant-numeric: tabular-nums; }
  th, td { text-align: start; padding: 8px 0; padding-inline-end: 12px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
  th { font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
  tr.on td { font-weight: 600; }
  .drawn { color: var(--drawn); } .pinned { color: var(--pinned); }
  .top { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: flex-start; }
  .top h1 { flex: 1 1 320px; min-width: 0; }
</style>

<main>
  <header style="display:flex;flex-direction:column;gap:8px">
    <div class="top">
      <h1 id="h1"></h1>
    </div>
    <p class="lede" id="lede"></p>
  </header>

  <div class="controls">
    <div class="tfs" id="tfs" role="group"></div>
    <label class="check" for="half"><input type="checkbox" id="half"> <span id="halfLabel"></span></label>
  </div>

  <div class="chartbox"><svg id="chart" viewBox="0 0 920 440" role="img"></svg></div>
  <div class="legend">
    <span id="legDrawn"></span>
    <span class="p" id="legDaily"></span>
    <span class="t" id="legTimed"></span>
  </div>

  <section style="display:flex;flex-direction:column;gap:10px">
    <h2 id="whyTitle"></h2>
    <ol id="why"></ol>
  </section>

  <section style="display:flex;flex-direction:column;gap:10px">
    <h2 id="arithTitle"></h2>
    <p class="lede" id="arithLede"></p>
    <div class="tablewrap"><table>
      <thead><tr id="heads"></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
  </section>
</main>

<script>
(function () {
  var SESSION = 12, DAYS = 10, D1 = 2, D2 = 6, H1 = 7, H2 = 4, P1 = 100, P2 = 108;
  var G1 = D1 * SESSION + H1, G2 = D2 * SESSION + H2;
  var TFS = [{ key: "1D", hours: 12 }, { key: "4H", hours: 4 }, { key: "1H", hours: 1 }];
  var active = "1H";
  try { active = localStorage.getItem("drift.tf") || active; } catch (e) {}

  // Days 8 and 9 roll over: day 8 drifts down, and day 9 falls through the
  // lines, so the day 9 candle's body straddles every line on the 1D chart.
  function closeAt(g) {
    if (g >= 8 * SESSION) {
      var k = g - 8 * SESSION + 1, wob = 0.3 * Math.sin(g * 1.3);
      return (k <= SESSION ? 117.8 - 1.3 * k / SESSION : 116.5 - 3.9 * (k - SESSION) / SESSION) + wob * (k % SESSION ? 1 : 0);
    }
    var base = P1 + (P2 - P1) * (g - G1) / (G2 - G1);
    var near = Math.min(Math.abs(g - G1), Math.abs(g - G2));
    var wave = g <= G2
      ? 9 * (1 - Math.cos(2 * Math.PI * (g - G1) / (G2 - G1))) / 2
      : 4 * (1 - Math.cos(2 * Math.PI * (g - G2) / 75)) / 2;
    var noise = (0.35 * Math.sin(g * 1.7) + 0.25 * Math.sin(g * 0.61 + 2)) * Math.min(1, near / 4);
    return base + wave + 0.8 * Math.min(near, 6) + noise;
  }

  function hourly(half) {
    var out = [], prev = closeAt(0) - 0.3;
    for (var g = 0; g < DAYS * SESSION; g++) {
      var day = Math.floor(g / SESSION), h = g % SESSION;
      var c = closeAt(g);
      var bar = { day: day, h: h, o: prev, c: c, hi: Math.max(prev, c) + 0.25, lo: Math.min(prev, c) - 0.25 };
      if (g === G1 || g === G2) {
        var p = g === G1 ? P1 : P2;
        bar.c = p + 0.35; bar.lo = p; bar.hi = Math.max(bar.o, bar.c) + 0.25;
      } else if (day === D1) bar.lo = Math.max(bar.lo, P1 + 0.1);
      else if (day === D2) bar.lo = Math.max(bar.lo, P2 + 0.1);
      prev = bar.c;
      if (half && day === 4 && h >= 6) continue;
      out.push(bar);
    }
    return out;
  }

  function candles(hours, per) {
    var out = [], cur = null;
    hours.forEach(function (b) {
      var slot = Math.floor(b.h / per);
      if (!cur || cur.day !== b.day || cur.slot !== slot) {
        cur = { day: b.day, slot: slot, o: b.o, c: b.c, hi: b.hi, lo: b.lo, oh: b.h, ch: b.h + 1 };
        out.push(cur);
      } else {
        cur.ch = b.h + 1; cur.c = b.c; cur.hi = Math.max(cur.hi, b.hi); cur.lo = Math.min(cur.lo, b.lo);
      }
    });
    return out;
  }

  function lowCandle(cs, day) {
    var best = -1;
    cs.forEach(function (c, i) { if (c.day === day && (best < 0 || c.lo < cs[best].lo)) best = i; });
    return best;
  }
  function firstOf(cs, day) { for (var i = 0; i < cs.length; i++) if (cs[i].day === day) return i; return -1; }
  function countOf(cs, day) { return cs.filter(function (c) { return c.day === day; }).length; }
  // Time model: each day trades 08:00 to 20:00 (12 one-hour candles), closed overnight.
  // Clock time is hours since day 0 00:00. Each low traded inside its hourly candle,
  // taken at that candle's midpoint.
  var OPEN = 8;
  function clock(day, h) { return day * 24 + OPEN + h; }
  var TL1 = clock(D1, H1 + 0.5), TL2 = clock(D2, H2 + 0.5), TNOW = clock(DAYS - 1, SESSION);
  function timedAt(t) { return P1 + (P2 - P1) * (t - TL1) / (TL2 - TL1); }
  function pinnedAt(day) { return P1 + (P2 - P1) / (D2 - D1) * (day - D1); }

  function measure(per, half) {
    var cs = candles(hourly(half), per);
    var c1 = lowCandle(cs, D1), c2 = lowCandle(cs, D2), last = cs.length - 1;
    var at = function (i) { return P1 + (P2 - P1) * (i - c1) / (c2 - c1); };
    return { cs: cs, c1: c1, c2: c2, last: last, at: at, drawn: at(last), pinned: pinnedAt(DAYS - 1), timed: timedAt(TNOW) };
  }

  function adjEn(k) { return k === 0 ? "" : (k > 0 ? ", plus " : ", minus ") + Math.abs(k); }
  var STR = {
    en: {
      h1: "One daily trendline, three charts, three prices",
      lede: "A trendline found on daily candles joins the low of day 2 (100) to the low of day 6 (108). It rises 2 points per daily candle, so on day 9 its value is 114.00. Each day trades 08:00 to 20:00. Each button below is a chart timeframe and shows the price of the drawn line at the last candle of that chart, and of the time-based line at the close of that candle.",
      tfsAria: "Chart timeframe",
      half: "Day 4 is a half session",
      legDrawn: "Drawn line: straight from the candle of the day 2 low to the candle of the day 6 low",
      legDaily: "Daily line: one value per day (day 2 = 100, +2 each day), held flat across that day's candles",
      legTimed: "Time-based line: through (day 2 15:30, 100) and (day 6 12:30, 108), one price per moment",
      arithTitle: "The arithmetic",
      arithLede: "The drawn line is straight from the candle of the day 2 low (price 100) to the candle of the day 6 low (price 108). Its slope is 8 ÷ B per candle, where 8 is the rise from 100 to 108 and B is the number of candles from the day 2 low to the day 6 low. Its price at the last candle is 100 + slope × A, where A is the number of candles from the day 2 low to the last candle. A and B are different on each chart timeframe, so the slope is too.",
      heads: ["Chart", "A: candles from day 2 low to last candle", "B: candles from day 2 low to day 6 low", "Slope (per candle)", "Drawn line at last candle", "Difference from daily value 114.00", "Time-based line at last close"],
      chart: function (tf) { return tf + " chart"; },
      exact: "exactly the daily value",
      vs: function (d) { return d + " vs daily 114.00"; },
      exactShort: "exact",
      candles: function (k) { return k + (k === 1 ? " candle" : " candles"); },
      formula: function (x) { return x; },
      day: function (d) { return "day " + d; },
      low: function (v) { return "low " + v; },
      why1D: "Why the 1D chart reads 114.00",
      why: function (tf, v) { return "Why the " + tf + " chart reads " + v + " instead of 114.00"; },
      items1D: [
        "Day 2 low (100) is the day 2 candle. Day 6 low (108) is the day 6 candle.",
        "Day 2 candle → day 6 candle = 4 candles.",
        "Day 2 candle → last candle (day 9 candle) = 7 candles.",
        "Slope: 8 ÷ 4 = 2 per candle. Line at last candle: 100 + 2 × 7 = 114.00."
      ],
      timed: function (v) { return "time-based " + v; },
      timedItems: function (v) {
        return [
          "Time-based line: day 2 15:30 → day 6 12:30 = 93 hours. Slope: 8 ÷ 93 per hour.",
          "Day 2 15:30 → close of the last candle (day 9 20:00) = 172.5 hours. Time-based line there: 100 + slope × 172.5 = " + v + ", on every chart.",
          "It steps up at every night: 12 hours with no candles add 12 × 8 ÷ 93 = 1.03 points."
        ];
      },
      items: function (q) {
        var h = q.half ? ", day 4 has only " + q.d4 : "";
        return [
          "Day 2 low (100) is on day 2 candle " + q.o1 + ". Day 6 low (108) is on day 6 candle " + q.o2 + ". A full day is " + q.full + " candles.",
          "Day 2 candle " + q.o1 + " → day 6 candle " + q.o2 + " = " + q.between + " candles (4 days = " + q.whole + h + adjEn(q.o2 - q.o1) + ").",
          "Day 2 candle " + q.o1 + " → last candle (day 9 candle " + q.oL + ") = " + q.toLast + " candles (7 days = " + q.toLastDay + h + adjEn(q.oL - q.o1) + ").",
          "Slope: 8 ÷ " + q.between + " per candle. Drawn line at last candle: 100 + slope × " + q.toLast + " = " + q.drawn + ". Daily value for day 9: 114.00."
        ];
      }
    }
  };
  function tr() { return STR.en; }

  var NS = "http://www.w3.org/2000/svg";
  function el(tag, attrs, text) {
    var n = document.createElementNS(NS, tag);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (text != null) n.textContent = text;
    return n;
  }
  function f2(v) { return v.toFixed(2); }
  function isExact(v) { return Math.abs(v) < 0.005; }
  function signed(v) { return (v > 0 ? "+" : "−") + f2(Math.abs(v)); }

  function drawChart(m) {
    var svg = document.getElementById("chart");
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    var W = 920, H = 440, L = 10, R = 96, T = 16, B = 30;
    var cs = m.cs, n = cs.length, step = (W - L - R) / n;
    var lo = Infinity, hi = -Infinity;
    hourly(false).forEach(function (b) { lo = Math.min(lo, b.lo); hi = Math.max(hi, b.hi); });
    lo -= 1; hi += 1;
    var x = function (i) { return L + (i + 0.5) * step; };
    var y = function (p) { return T + (hi - p) / (hi - lo) * (H - T - B); };

    for (var d = 0; d < DAYS; d++) {
      var a = firstOf(cs, d), cnt = countOf(cs, d);
      if (d % 2 === 0) svg.appendChild(el("rect", { x: L + a * step, y: T, width: cnt * step, height: H - T - B, fill: "var(--band)" }));
      svg.appendChild(el("text", { x: L + (a + cnt / 2) * step, y: H - 10, "text-anchor": "middle" }, tr().day(d)));
    }
    for (var g = Math.ceil(lo / 5) * 5; g < hi; g += 5) {
      svg.appendChild(el("line", { x1: L, x2: W - R, y1: y(g), y2: y(g), stroke: "var(--rule)", "stroke-width": 1 }));
      svg.appendChild(el("text", { x: W - 6, y: y(g) + 4, "text-anchor": "end" }, String(g)));
    }
    var bw = Math.max(1.5, Math.min(26, step * 0.62));
    cs.forEach(function (c, i) {
      var col = c.c >= c.o ? "var(--up)" : "var(--down)";
      svg.appendChild(el("line", { x1: x(i), x2: x(i), y1: y(c.hi), y2: y(c.lo), stroke: col, "stroke-width": 1 }));
      var top = y(Math.max(c.o, c.c)), bot = y(Math.min(c.o, c.c));
      svg.appendChild(el("rect", { x: x(i) - bw / 2, y: top, width: bw, height: Math.max(1, bot - top), fill: col }));
    });

    // Daily values as steps: each day holds its one value, horizontal across
    // all of that day's candles, then jumps to the next day's value.
    var pts = [];
    for (var dd = D1; dd < DAYS; dd++) {
      var x0 = L + firstOf(cs, dd) * step, x1 = x0 + countOf(cs, dd) * step, yv = y(pinnedAt(dd));
      pts.push([x0, yv], [x1, yv]);
    }
    svg.appendChild(el("polyline", { points: pts.map(function (p) { return p[0] + "," + p[1]; }).join(" "), fill: "none", stroke: "var(--pinned)", "stroke-width": 1.5, "stroke-dasharray": "5 4" }));

    // The line as drawn.
    svg.appendChild(el("line", { x1: x(m.c1), y1: y(P1), x2: x(m.last), y2: y(m.drawn), stroke: "var(--drawn)", "stroke-width": 2 }));
    [[m.c1, P1], [m.c2, P2]].forEach(function (a2) {
      svg.appendChild(el("circle", { cx: x(a2[0]), cy: y(a2[1]), r: 6, fill: "var(--surface)", stroke: "var(--drawn)", "stroke-width": 2 }));
    });
    svg.appendChild(el("text", { x: x(m.c1), y: y(P1) + 20, "text-anchor": "middle" }, tr().low(100)));
    svg.appendChild(el("text", { x: x(m.c2), y: y(P2) + 20, "text-anchor": "middle" }, tr().low(108)));

    // Time-based line: inside a candle, x is linear in clock time; between
    // days the chart skips the night, so the line steps up at the boundary.
    var xTime = function (i, t) { var c = cs[i]; return L + (i + (t - clock(c.day, c.oh)) / (c.ch - c.oh)) * step; };
    var tp = [];
    cs.forEach(function (c, i) {
      var t0 = clock(c.day, c.oh), t1 = clock(c.day, c.ch);
      if (t1 <= TL1) return;
      var ts = Math.max(t0, TL1);
      tp.push([xTime(i, ts), y(timedAt(ts))], [xTime(i, t1), y(timedAt(t1))]);
    });
    svg.appendChild(el("polyline", { points: tp.map(function (p) { return p[0] + "," + p[1]; }).join(" "), fill: "none", stroke: "var(--timed)", "stroke-width": 2, "stroke-dasharray": "2 3" }));
    [TL1, TL2].forEach(function (t, k) {
      var i = cs.findIndex(function (c) { return clock(c.day, c.oh) <= t && t < clock(c.day, c.ch); });
      var cx = xTime(i, t), cy = y(k ? P2 : P1);
      svg.appendChild(el("rect", { x: cx - 4, y: cy - 4, width: 8, height: 8, fill: "var(--timed)", transform: "rotate(45 " + cx + " " + cy + ")" }));
    });

    // Last-candle readout: three labels, sorted top to bottom, kept 15px apart.
    var xl = x(m.last), tx = W - R + 12, xr = L + n * step;
    svg.appendChild(el("circle", { cx: xl, cy: y(m.drawn), r: 3.5, fill: "var(--drawn)" }));
    svg.appendChild(el("circle", { cx: xr, cy: y(m.timed), r: 3.5, fill: "var(--timed)" }));
    var labs = [[m.drawn, "--drawn"], [m.pinned, "--pinned"], [m.timed, "--timed"]]
      .filter(function (a2, k) { return !(k === 1 && isExact(m.drawn - m.pinned)); })
      .map(function (a2) { return { y: y(a2[0]), v: a2[0], c: a2[1] }; })
      .sort(function (a2, b2) { return a2.y - b2.y; });
    for (var k = 1; k < labs.length; k++) labs[k].ly = Math.max(labs[k].y, (labs[k - 1].ly || labs[k - 1].y) + 15);
    labs[0].ly = labs[0].y;
    labs.forEach(function (lb) {
      svg.appendChild(el("text", { x: tx, y: lb.ly + 4, style: "fill:var(" + lb.c + ");font-weight:600;font-size:12px" }, f2(lb.v)));
    });
  }

  function render() {
    var half = document.getElementById("half").checked;
    var S = tr(), $ = function (id) { return document.getElementById(id); };
    $("h1").textContent = S.h1; $("lede").textContent = S.lede;
    $("halfLabel").textContent = S.half; $("tfs").setAttribute("aria-label", S.tfsAria);
    $("legDrawn").textContent = S.legDrawn; $("legDaily").textContent = S.legDaily; $("legTimed").textContent = S.legTimed;
    $("arithTitle").textContent = S.arithTitle; $("arithLede").textContent = S.arithLede;
    $("heads").textContent = "";
    S.heads.forEach(function (h) { var th = document.createElement("th"); th.textContent = h; $("heads").appendChild(th); });
    var all = TFS.map(function (t) { return { tf: t, m: measure(t.hours, half) }; });

    var tfs = document.getElementById("tfs");
    tfs.textContent = "";
    all.forEach(function (r) {
      var b = document.createElement("button");
      b.className = "tf"; b.type = "button"; b.id = "tf-" + r.tf.key;
      b.setAttribute("aria-pressed", String(r.tf.key === active));
      [["lab", S.chart(r.tf.key)], ["val", f2(r.m.drawn)], ["off", isExact(r.m.drawn - r.m.pinned) ? S.exact : S.vs(signed(r.m.drawn - r.m.pinned))], ["off timed", S.timed(f2(r.m.timed))]].forEach(function (p) {
        var s = document.createElement("span"); s.className = p[0]; s.textContent = p[1]; b.appendChild(s);
      });
      b.addEventListener("click", function () {
        active = r.tf.key;
        try { localStorage.setItem("drift.tf", active); } catch (e) {}
        render();
        document.getElementById("tf-" + active).focus();
      });
      tfs.appendChild(b);
    });

    var cur = all.filter(function (r) { return r.tf.key === active; })[0] || all[2];
    var m = cur.m, cs = m.cs;
    drawChart(m);

    var why = document.getElementById("why");
    why.textContent = "";
    var tfk = cur.tf.key, items;
    var lastDay = DAYS - 1;
    if (tfk === "1D") {
      $("whyTitle").textContent = S.why1D;
      items = S.items1D;
    } else {
      $("whyTitle").textContent = S.why(tfk, f2(m.drawn));
      var full = countOf(cs, D1), d4 = countOf(cs, 4);
      items = S.items({
        o1: m.c1 - firstOf(cs, D1) + 1, o2: m.c2 - firstOf(cs, D2) + 1, oL: m.last - firstOf(cs, lastDay) + 1,
        whole: firstOf(cs, D2) - firstOf(cs, D1), between: m.c2 - m.c1,
        toLastDay: firstOf(cs, lastDay) - firstOf(cs, D1), toLast: m.last - m.c1,
        full: full, d4: d4, half: d4 !== full, drawn: f2(m.drawn)
      });
    }
    items = items.concat(S.timedItems(f2(m.timed)));
    items.forEach(function (t) { var li = document.createElement("li"); li.textContent = t; why.appendChild(li); });

    var rows = document.getElementById("rows");
    rows.textContent = "";
    all.forEach(function (r) {
      var tr = document.createElement("tr");
      if (r.tf.key === active) tr.className = "on";
      var between = r.m.c2 - r.m.c1, toLast = r.m.last - r.m.c1, diff = r.m.drawn - r.m.pinned;
      var sl = 8 % between === 0 ? String(8 / between) : (8 / between).toFixed(3) + "…";
      [r.tf.key, S.candles(toLast), S.candles(between),
        S.formula("8 ÷ " + between + " = " + sl),
        S.formula("100 + " + sl + " × " + toLast + " = " + f2(r.m.drawn)),
        isExact(diff) ? S.exactShort : S.formula(signed(diff)),
        f2(r.m.timed)
      ].forEach(function (t) { var td = document.createElement("td"); td.textContent = t; tr.appendChild(td); });
      rows.appendChild(tr);
    });
  }

  document.getElementById("half").addEventListener("change", render);
  render();
})();
</script>
